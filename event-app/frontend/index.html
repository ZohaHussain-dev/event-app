<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Event Management</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f4f6fb;color:#1c2333}
  header{background:linear-gradient(135deg,#1f3c88,#3a6ea5);color:#fff;padding:48px 20px;text-align:center}
  header h1{margin:0 0 8px;font-size:2.2rem} header p{margin:0;opacity:.9}
  main{max-width:960px;margin:30px auto;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
  .card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .card h3{margin:0 0 6px;color:#1f3c88} .meta{font-size:.85rem;color:#667}
  form{background:#fff;border-radius:12px;padding:22px;margin-top:28px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  input,select,button{width:100%;padding:10px;margin:6px 0;border:1px solid #ccd;border-radius:8px;font-size:1rem}
  button{background:#1f3c88;color:#fff;border:none;cursor:pointer} button:hover{background:#16306d}
  #msg{margin-top:8px;font-weight:600} table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff}
  td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:.9rem}
  footer{text-align:center;padding:20px;color:#889;font-size:.85rem}
</style>
</head>
<body>
<header><h1>Campus Event Management</h1><p>NESCON &middot; ACM Hackathon &middot; Execup &middot; Visionspark</p></header>
<main>
  <h2>Upcoming Events</h2>
  <div class="grid" id="events"></div>

  <form id="regForm">
    <h2>Register</h2>
    <input id="name" placeholder="Full name" required>
    <input id="email" type="email" placeholder="Email" required>
    <select id="event"></select>
    <button type="submit">Register</button>
    <div id="msg"></div>
  </form>

  <h2>Recent Registrations</h2>
  <table><thead><tr><th>#</th><th>Name</th><th>Email</th><th>Event</th></tr></thead><tbody id="regs"></tbody></table>
</main>
<footer>Three-tier app &middot; Nginx + Flask + PostgreSQL &middot; Deployed by Jenkins on Kubernetes</footer>
<script>
let evs=[];
async function load(){
  evs=await (await fetch('/api/events')).json();
  document.getElementById('events').innerHTML=evs.map(e=>`<div class="card"><h3>${e.name}</h3><div class="meta">${e.date} &bull; ${e.venue}</div><p>${e.desc}</p></div>`).join('');
  document.getElementById('event').innerHTML=evs.map(e=>`<option value="${e.id}">${e.name}</option>`).join('');
  loadRegs();
}
async function loadRegs(){
  const r=await (await fetch('/api/registrations')).json();
  document.getElementById('regs').innerHTML=r.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.email}</td><td>${(evs.find(e=>e.id==x.event_id)||{}).name||x.event_id}</td></tr>`).join('');
}
document.getElementById('regForm').onsubmit=async ev=>{
  ev.preventDefault();
  const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:document.getElementById('name').value,email:document.getElementById('email').value,event_id:document.getElementById('event').value})});
  const j=await res.json();
  const m=document.getElementById('msg');
  m.textContent=j.message||j.error; m.style.color=res.ok?'green':'red';
  if(res.ok){document.getElementById('regForm').reset();loadRegs();}
};
load();
</script>
</body>
</html>
