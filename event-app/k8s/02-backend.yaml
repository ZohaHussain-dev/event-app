apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: event-app
spec:
  replicas: 2
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: backend
          image: event-backend:IMAGE_TAG
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - {name: DB_HOST, value: postgres}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_DB}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: db-secret, key: POSTGRES_PASSWORD}}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: event-app
  labels: {app: backend}
spec:
  selector: {app: backend}
  ports:
    - name: http
      port: 5000
      targetPort: 5000
